# Place build artifacts in an ASCII directory (avoids non-ASCII path issues with GNU ld).
[build]
target-dir = "C:/Users/Master/AppData/Local/LuminaCalc-target"
target = "x86_64-pc-windows-gnullvm"

# Host proc-macros use Rust's self-contained MinGW GCC (MSVCRT).
[target.x86_64-pc-windows-gnu]
linker = "C:/Users/Master/.rustup/toolchains/stable-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/bin/self-contained/x86_64-w64-mingw32-gcc.exe"
rustflags = ["-C", "link-self-contained=yes"]

# Target binaries use LLVM-MinGW (UCRT + lld + llvm-dlltool — full `raw-dylib` compatibility).
[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-clang"
