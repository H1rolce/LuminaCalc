name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x86_64 MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p lumina-ui

      - name: Package Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage-win | Out-Null
          Copy-Item target\release\lumina-ui.exe stage-win\LuminaCalc.exe
          Copy-Item LICENSE stage-win\LICENSE
          Compress-Archive -Path stage-win\* -DestinationPath dist\LuminaCalc-windows-x86_64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaCalc-windows-x86_64
          path: dist/LuminaCalc-windows-x86_64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p lumina-ui

      - name: Package Linux tar.gz
        run: |
          mkdir -p dist stage-tar/LuminaCalc
          cp target/release/lumina-ui stage-tar/LuminaCalc/luminacalc
          chmod +x stage-tar/LuminaCalc/luminacalc
          cp lumina-ui/assets/luminacalc.desktop stage-tar/LuminaCalc/luminacalc.desktop
          cp lumina-ui/assets/icon.png stage-tar/LuminaCalc/luminacalc.png
          cp LICENSE stage-tar/LuminaCalc/LICENSE
          tar -czf dist/LuminaCalc-linux-x86_64.tar.gz -C stage-tar LuminaCalc

      - name: Package Linux AppImage
        run: |
          mkdir -p dist AppDir/usr/bin
          cp target/release/lumina-ui AppDir/usr/bin/luminacalc
          chmod +x AppDir/usr/bin/luminacalc
          cp lumina-ui/assets/luminacalc.desktop AppDir/luminacalc.desktop
          cp lumina-ui/assets/icon.png AppDir/luminacalc.png
          cp lumina-ui/assets/icon.png AppDir/.DirIcon
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/luminacalc" "$@"
          EOF
          chmod +x AppDir/AppRun

          curl -fSL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir dist/LuminaCalc-linux-x86_64.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuminaCalc-linux-x86_64
          path: |
            dist/LuminaCalc-linux-x86_64.tar.gz
            dist/LuminaCalc-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Create Draft GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/LuminaCalc-windows-x86_64.zip
            dist/LuminaCalc-linux-x86_64.tar.gz
            dist/LuminaCalc-linux-x86_64.AppImage
